services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: devauclaire/cyber-dashboard-migrate:2.0.1
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      CYBER_DASHBOARD_SECRET_KEY_FILE: /run/secrets/cyber_dashboard_secret_key
      CYBER_DASHBOARD_SECRET_KEY: ${CYBER_DASHBOARD_SECRET_KEY}
      OGO_USERNAME: ${OGO_USERNAME:-}
      OGO_API_KEY: ${OGO_API_KEY:-}
      SERENICITY_API_KEY: ${SERENICITY_API_KEY:-}
    command: ["python", "/app/scripts/db/migrate.py"]
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - cyber_dashboard_secret_key

  api:
    image: devauclaire/cyber-dashboard-api:2.0.1
    environment:
      API_NAME: ${API_NAME}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CYBER_DASHBOARD_SECRET_KEY_FILE: /run/secrets/cyber_dashboard_secret_key
      CYBER_DASHBOARD_SECRET_KEY: ${CYBER_DASHBOARD_SECRET_KEY}
      OGO_BASE_URL: ${OGO_BASE_URL}
      SERENICITY_BASE_URL: ${SERENICITY_BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - cyber_dashboard_secret_key

  scheduler:
    image: devauclaire/cyber-dashboard-scheduler:2.0.0
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LIMIT_REQUEST_PER_DAY: ${LIMIT_REQUEST_PER_DAY}
      LOG_LEVEL: ${LOG_LEVEL}
      CYBER_DASHBOARD_SECRET_KEY_FILE: /run/secrets/cyber_dashboard_secret_key
      CYBER_DASHBOARD_SECRET_KEY: ${CYBER_DASHBOARD_SECRET_KEY}
      OGO_BASE_URL: ${OGO_BASE_URL}
      SERENICITY_BASE_URL: ${SERENICITY_BASE_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    secrets:
      - cyber_dashboard_secret_key

  common-ip-correlator:
    image: devauclaire/cyber-dashboard-common-ip:2.0.0
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORRELATOR_BATCH_SIZE: ${CORRELATOR_BATCH_SIZE}
      CORRELATOR_POLL_INTERVAL_SECONDS: ${CORRELATOR_POLL_INTERVAL_SECONDS}
      CORRELATOR_LOG_LEVEL: ${CORRELATOR_LOG_LEVEL}
      CORRELATOR_COMPUTE_AVERAGE_PROCESSING_TIME: ${CORRELATOR_COMPUTE_AVERAGE_PROCESSING_TIME}
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: devauclaire/cyber-dashboard-frontend:2.0.3
    depends_on:
      - api

  reverse-proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend

volumes:
  db_data: {}

secrets:
  cyber_dashboard_secret_key:
    file: ./secrets/cyber_dashboard_secret_key
